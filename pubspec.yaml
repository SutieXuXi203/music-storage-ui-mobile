name: mobile_ui
description: "Ứng dụng nghe nhạc Music Storage đa nền tảng kết nối FastAPI & Google Drive"
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Networking & Storage
  dio: ^5.7.0
  shared_preferences: ^2.3.2

  # Audio Playback
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # UI & Media
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  reicon_flutter: ^1.0.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
