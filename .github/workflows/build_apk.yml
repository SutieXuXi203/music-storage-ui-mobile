name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          python3 - << 'PYEOF'
          import base64, os
          ks_b64 = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().lstrip('\ufeff')
          with open('android/app/release.keystore', 'wb') as f:
              f.write(base64.b64decode(ks_b64))

          store_pass = os.environ.get('KEYSTORE_STORE_PASSWORD', '').strip().lstrip('\ufeff')
          key_pass = os.environ.get('KEYSTORE_KEY_PASSWORD', '').strip().lstrip('\ufeff')
          key_alias = os.environ.get('KEYSTORE_KEY_ALIAS', '').strip().lstrip('\ufeff')

          with open('android/key.properties', 'w', encoding='utf-8') as f:
              f.write(f"storePassword={store_pass}\n")
              f.write(f"keyPassword={key_pass}\n")
              f.write(f"keyAlias={key_alias}\n")
              f.write("storeFile=release.keystore\n")
          PYEOF
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      - name: Build APK Release
        run: |
          API_URL="${{ secrets.API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://music-storage-backend.fly.dev/api"
          fi
          echo "Building APK with API_BASE_URL=$API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/meowsic.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sutorage.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meowsic-Release-APK
          path: build/app/outputs/flutter-apk/meowsic.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.19
          name: Meowsic App Release v1.0.19
          body: |
            ## Meowsic Music App Android Release v1.0.19
            - Tên hiển thị trên điện thoại: **Meowsic**
            - Phiên bản: **v1.0.19** (Build 20)
            - **Đưa khu vực Thư mục lên trên cùng Trang chủ**:
              - Khu vực thư mục bộ sưu tập được chuyển lên đầu tab Trang chủ (ngay dưới header chào mừng), giúp duyệt và mở các thư mục nhạc nhanh chóng và tiện lợi.
            - **Việt hóa toàn diện 100% giao diện**:
              - Toàn bộ giao diện từ các tab điều hướng, tiêu đề màn hình, menu thao tác bài hát, dialog xác nhận đến các thông báo hệ thống đều được bản địa hóa sang Tiếng Việt chuẩn mực và tự nhiên.
            - **Nâng cấp thanh thông báo (SnackBar) công nghệ cao, độ tương phản sắc nét**:
              - Khắc phục hoàn toàn lỗi thông báo cập nhật bị tối màu, chìm vào nền đen trong Dark Mode.
              - Chữ hiển thị màu trắng rõ nét, tích hợp icon trạng thái công nghệ (`check_circle_outline_rounded` / cảnh báo đỏ) và khung viền nổi bật.
              - Cơ chế tự hủy thông báo cũ tức thì khi xuất hiện thông báo mới, không gây trễ giao diện.
            - Ký bằng **Release Keystore cố định** (Hỗ trợ cài đè/cập nhật trực tiếp không cần gỡ app cũ).
            - Tải file `meowsic.apk` bên dưới về điện thoại và cài đặt.
          files: |
            build/app/outputs/flutter-apk/meowsic.apk
            build/app/outputs/flutter-apk/sutorage.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
