name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=https://music-storage-backend.fly.dev/api
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sutorage.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sutorage-Release-APK
          path: build/app/outputs/flutter-apk/sutorage.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: Sutorage App Release v1.0.1
          body: |
            ## Sutorage Music App Android Release
            - Tên hiển thị trên điện thoại: **Sutorage**
            - Tự động kết nối với Fly.io Backend: `https://music-storage-backend.fly.dev/api`
            - Tải file `sutorage.apk` bên dưới về điện thoại và cài đặt.
          files: build/app/outputs/flutter-apk/sutorage.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
