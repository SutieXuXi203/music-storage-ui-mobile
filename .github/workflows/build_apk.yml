name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          python3 - << 'PYEOF'
          import base64, os
          ks_b64 = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().lstrip('\ufeff')
          with open('android/app/release.keystore', 'wb') as f:
              f.write(base64.b64decode(ks_b64))

          store_pass = os.environ.get('KEYSTORE_STORE_PASSWORD', '').strip().lstrip('\ufeff')
          key_pass = os.environ.get('KEYSTORE_KEY_PASSWORD', '').strip().lstrip('\ufeff')
          key_alias = os.environ.get('KEYSTORE_KEY_ALIAS', '').strip().lstrip('\ufeff')

          with open('android/key.properties', 'w', encoding='utf-8') as f:
              f.write(f"storePassword={store_pass}\n")
              f.write(f"keyPassword={key_pass}\n")
              f.write(f"keyAlias={key_alias}\n")
              f.write("storeFile=release.keystore\n")
          PYEOF
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      - name: Build APK Release
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sutorage.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sutorage-Release-APK
          path: build/app/outputs/flutter-apk/sutorage.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: Sutorage App Release v1.0.9
          body: |
            ## Sutorage Music App Android Release v1.0.9
            - Tên hiển thị trên điện thoại: **Sutorage**
            - Phiên bản: **v1.0.9** (Build 10)
            - **Thông báo thanh trạng thái thiết bị**: Tự động hiển thị tiến trình và % tải nhạc trực tiếp lên thanh thông báo của điện thoại theo thời gian thực khi thoát ứng dụng ra màn hình chính.
            - Thông báo rung/chuông khi hoàn tất tải nhạc và lưu vào thư viện / Google Drive.
            - Hỗ trợ tải ngầm (Background download) không bị gián đoạn.
            - Ký bằng **Release Keystore cố định** (Hỗ trợ cài đè/cập nhật trực tiếp không cần gỡ app cũ).
            - Tải file `sutorage.apk` bên dưới về điện thoại và cài đặt.
          files: build/app/outputs/flutter-apk/sutorage.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
