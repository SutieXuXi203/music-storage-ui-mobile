name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          python3 - << 'PYEOF'
          import base64, os
          ks_b64 = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().lstrip('\ufeff')
          with open('android/app/release.keystore', 'wb') as f:
              f.write(base64.b64decode(ks_b64))

          store_pass = os.environ.get('KEYSTORE_STORE_PASSWORD', '').strip().lstrip('\ufeff')
          key_pass = os.environ.get('KEYSTORE_KEY_PASSWORD', '').strip().lstrip('\ufeff')
          key_alias = os.environ.get('KEYSTORE_KEY_ALIAS', '').strip().lstrip('\ufeff')

          with open('android/key.properties', 'w', encoding='utf-8') as f:
              f.write(f"storePassword={store_pass}\n")
              f.write(f"keyPassword={key_pass}\n")
              f.write(f"keyAlias={key_alias}\n")
              f.write("storeFile=release.keystore\n")
          PYEOF
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      - name: Build APK Release
        run: |
          API_URL="${{ secrets.API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://music-storage-backend.fly.dev/api"
          fi
          echo "Building APK with API_BASE_URL=$API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/meowsic.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sutorage.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meowsic-Release-APK
          path: build/app/outputs/flutter-apk/meowsic.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.18
          name: Meowsic App Release v1.0.18
          body: |
            ## Meowsic Music App Android Release v1.0.18
            - Tên hiển thị trên điện thoại: **Meowsic**
            - Phiên bản: **v1.0.18** (Build 19)
            - **Tối ưu hiệu năng 60–120fps siêu mượt mà**:
              - Tích hợp bộ đệm nén ảnh thu nhỏ theo kích thước khung hình (`AppCoverImage`), giải phóng tối đa RAM và GPU khi cuộn danh sách bài hát lớn.
              - Phân tách stream thời gian phát nhạc độc lập, triệt tiêu giật khung hình và hiện tượng re-render toàn màn hình khi đang phát nhạc.
              - Cô lập render bằng `RepaintBoundary` cho Equalizer, sóng nhạc, mini-player và download HUD.
              - Áp dụng vật lý cuộn nảy `BouncingScrollPhysics` trên toàn bộ danh sách và tab điều hướng.
            - **Tinh chỉnh giao diện Minimalist Tech cao cấp**:
              - Nút Play phát nhạc công nghệ với các đường viền vòng cung mượt mà bao quanh (loại bỏ các vạch gai nhô ra ngoài).
              - Sóng nhạc và Equalizer liên tục mượt mà, hiển thị tinh gọn và thanh lịch.
              - Khôi phục typography và hình khối bo góc tinh tế `4.0`, loại bỏ mọi chi tiết rườm rà.
            - Ký bằng **Release Keystore cố định** (Hỗ trợ cài đè/cập nhật trực tiếp không cần gỡ app cũ).
            - Tải file `meowsic.apk` bên dưới về điện thoại và cài đặt.
          files: |
            build/app/outputs/flutter-apk/meowsic.apk
            build/app/outputs/flutter-apk/sutorage.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
