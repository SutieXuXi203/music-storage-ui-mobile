name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          python3 - << 'PYEOF'
          import base64, os
          ks_b64 = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().lstrip('\ufeff')
          with open('android/app/release.keystore', 'wb') as f:
              f.write(base64.b64decode(ks_b64))

          store_pass = os.environ.get('KEYSTORE_STORE_PASSWORD', '').strip().lstrip('\ufeff')
          key_pass = os.environ.get('KEYSTORE_KEY_PASSWORD', '').strip().lstrip('\ufeff')
          key_alias = os.environ.get('KEYSTORE_KEY_ALIAS', '').strip().lstrip('\ufeff')

          with open('android/key.properties', 'w', encoding='utf-8') as f:
              f.write(f"storePassword={store_pass}\n")
              f.write(f"keyPassword={key_pass}\n")
              f.write(f"keyAlias={key_alias}\n")
              f.write("storeFile=release.keystore\n")
          PYEOF
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      - name: Build APK Release
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/meowsic.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sutorage.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meowsic-Release-APK
          path: build/app/outputs/flutter-apk/meowsic.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.16
          name: Meowsic App Release v1.0.16
          body: |
            ## Meowsic Music App Android Release v1.0.16
            - Tên hiển thị trên điện thoại: **Meowsic**
            - Phiên bản: **v1.0.16** (Build 17)
            - **Recently Played chuẩn 5 bài nghe gần đây nhất (Cơ chế LRU)**:
              - Danh sách hiển thị chính xác tối đa 5 bài nhạc được nghe gần đây.
              - Khi nghe một bài nhạc mới, bài đó sẽ được đẩy lên đầu tiên (vị trí 1), bài nghe sớm nhất ở cuối danh sách sẽ tự động bị thay thế (ví dụ: đang có `1, 2, 3, 4, 5`, nghe bài `6` sẽ đổi thành `6, 1, 2, 3, 4`).
              - Nếu nghe lại một bài đã có trong danh sách (ví dụ nghe bài `3`), bài đó sẽ lập tức được đẩy lên đầu danh sách (`3, 6, 1, 2, 4`).
              - Lưu trữ bền vững trên thiết bị qua SharedPreferences, không bị mất danh sách khi đóng/mở lại ứng dụng.
              - Chạm vào toàn bộ thanh bài hát (hoặc nút play) để phát nhạc ngay tức thì.
            - **Chuyển tab Library sang bên trái tab Search**: Thanh điều hướng hiện theo thứ tự `[Home, Library, Search]`.
            - **Bỏ hẳn thư mục mặc định & xóa triệt để tự động tạo lại**: Giờ đây người dùng toàn quyền quản lý thư mục cá nhân.
            - Ký bằng **Release Keystore cố định** (Hỗ trợ cài đè/cập nhật trực tiếp không cần gỡ app cũ).
            - Tải file `meowsic.apk` bên dưới về điện thoại và cài đặt.
          files: |
            build/app/outputs/flutter-apk/meowsic.apk
            build/app/outputs/flutter-apk/sutorage.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
