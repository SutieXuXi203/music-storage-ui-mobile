name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          python3 - << 'PYEOF'
          import base64, os
          ks_b64 = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().lstrip('\ufeff')
          with open('android/app/release.keystore', 'wb') as f:
              f.write(base64.b64decode(ks_b64))

          store_pass = os.environ.get('KEYSTORE_STORE_PASSWORD', '').strip().lstrip('\ufeff')
          key_pass = os.environ.get('KEYSTORE_KEY_PASSWORD', '').strip().lstrip('\ufeff')
          key_alias = os.environ.get('KEYSTORE_KEY_ALIAS', '').strip().lstrip('\ufeff')

          with open('android/key.properties', 'w', encoding='utf-8') as f:
              f.write(f"storePassword={store_pass}\n")
              f.write(f"keyPassword={key_pass}\n")
              f.write(f"keyAlias={key_alias}\n")
              f.write("storeFile=release.keystore\n")
          PYEOF
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      - name: Build APK Release
        run: |
          API_URL="${{ secrets.API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://music-storage-backend.fly.dev/api"
          fi
          echo "Building APK with API_BASE_URL=$API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/meowsic.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sutorage.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meowsic-Release-APK
          path: build/app/outputs/flutter-apk/meowsic.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.20
          name: Meowsic App Release v1.0.20
          body: |
            ## Meowsic Music App Android Release v1.0.20
            - Tên hiển thị trên điện thoại: **Meowsic**
            - Phiên bản: **v1.0.20** (Build 21)
            - **Khắc phục triệt để lỗi ảnh bìa thumbnail bị co giãn / biến dạng tỷ lệ**:
              - Tối ưu bộ giải mã ảnh theo tỷ lệ khung hình chuẩn xác, loại bỏ việc ép cưỡng bức khung hình thành vuông gây méo ảnh. Ảnh thumbnail của từng bài hát luôn hiển thị sắc nét, chuẩn tỷ lệ tự nhiên.
            - **Tái cấu trúc hàng đợi & Tích hợp khung "Bài tiếp theo" trực tiếp vào trình phát**:
              - Loại bỏ màn hình Hàng đợi riêng biệt, thay vào đó khi đang có bài hát phát mà thêm bài hát thứ 2 trở lên thì danh sách sẽ xuất hiện ngay trong khung **"Bài tiếp theo"** ở màn hình phát nhạc.
              - Danh sách bài tiếp theo hiển thị thứ tự `= 01`, `= 02`, ảnh bìa, tiêu đề, thời lượng và nút xóa từng bài hoặc xóa tất cả.
              - Thêm lựa chọn **"Phát tiếp theo"** vào menu 3 chấm của mỗi bài hát trên toàn ứng dụng.
            - **Hiển thị "Nhóm đang phát" tại Trang Chủ**:
              - Khi người dùng dừng hoặc tạm dừng nghe nhạc, nhóm phát hiện tại sẽ xuất hiện trực tiếp ở Trang Chủ với nhãn trạng thái trực quan, cho phép tiếp tục nghe lại ngay lập tức.
            - **Kiểm soát phát nhạc trong nền & Hỏi ý kiến người dùng**:
              - Tắt tự động phát nhạc khi rời ứng dụng / tắt màn hình; thay vào đó hiển thị hộp thoại hỏi người dùng có muốn phát nhạc trong nền không.
              - Thêm công tắc cài đặt bật/tắt tính năng phát nhạc trong nền trong trang Cài đặt.
            - Ký bằng **Release Keystore cố định** (Hỗ trợ cài đè/cập nhật trực tiếp không cần gỡ app cũ).
            - Tải file `meowsic.apk` bên dưới về điện thoại và cài đặt.
          files: |
            build/app/outputs/flutter-apk/meowsic.apk
            build/app/outputs/flutter-apk/sutorage.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
