name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          python3 - << 'PYEOF'
          import base64, os
          ks_b64 = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().lstrip('\ufeff')
          with open('android/app/release.keystore', 'wb') as f:
              f.write(base64.b64decode(ks_b64))

          store_pass = os.environ.get('KEYSTORE_STORE_PASSWORD', '').strip().lstrip('\ufeff')
          key_pass = os.environ.get('KEYSTORE_KEY_PASSWORD', '').strip().lstrip('\ufeff')
          key_alias = os.environ.get('KEYSTORE_KEY_ALIAS', '').strip().lstrip('\ufeff')

          with open('android/key.properties', 'w', encoding='utf-8') as f:
              f.write(f"storePassword={store_pass}\n")
              f.write(f"keyPassword={key_pass}\n")
              f.write(f"keyAlias={key_alias}\n")
              f.write("storeFile=release.keystore\n")
          PYEOF
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      - name: Build APK Release
        run: |
          API_URL="${{ secrets.API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://music-storage-backend.fly.dev/api"
          fi
          echo "Building APK with API_BASE_URL=$API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/meowsic.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meowsic-Release-APK
          path: build/app/outputs/flutter-apk/meowsic.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.22
          name: Meowsic App Release v1.0.22
          body: |
            ## Meowsic Music App Android Release v1.0.22
            - Tên hiển thị trên điện thoại: **Meowsic**
            - Phiên bản: **v1.0.22** (Build 23)
            - **Lời bài hát đồng bộ công nghệ (TechLyricsView)**:
              - Giao diện monochrome trắng thuần tối giản, loại bỏ chi tiết thừa.
              - Vạch sáng công nghệ căn giữa chính xác theo dòng thời gian bài hát.
              - Nút "Làm mới" đặt góc trên bên phải để tải lại lời bất kỳ lúc nào.
            - **Khôi phục hiển thị ảnh bìa thumbnail (Cover Art)**:
              - Tối ưu `AppCoverImage` với cơ chế hiển thị bản địa, loại bỏ lỗi gián đoạn CanvasKit trên Web.
              - Ưu tiên link ảnh tốc độ cao Google CDN LH3, kèm cơ chế tự động nạp link dự phòng nếu link chính gặp sự cố.
              - Hỗ trợ hiển thị ảnh bìa thông minh cho Thư mục/Playlist (lấy ảnh bài hát đầu tiên nếu chưa có ảnh riêng).
            - **Duy trì phiên đăng nhập lâu dài**:
              - Tự động kiểm tra và phục hồi phiên đăng nhập khi mở app, không bắt đăng nhập lại.
            - **HUD tiến trình tải nhạc công nghệ**:
              - Đổi sang tông màu trắng công nghệ, giữ màu xanh lá khi tải hoàn tất.
            - Ký bằng **Release Keystore cố định** (Hỗ trợ cài đè/cập nhật trực tiếp không cần gỡ app cũ).
            - Tải file `meowsic.apk` bên dưới về điện thoại và cài đặt.
          files: |
            build/app/outputs/flutter-apk/meowsic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
