name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          python3 - << 'PYEOF'
          import base64, os
          ks_b64 = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().lstrip('\ufeff')
          with open('android/app/release.keystore', 'wb') as f:
              f.write(base64.b64decode(ks_b64))

          store_pass = os.environ.get('KEYSTORE_STORE_PASSWORD', '').strip().lstrip('\ufeff')
          key_pass = os.environ.get('KEYSTORE_KEY_PASSWORD', '').strip().lstrip('\ufeff')
          key_alias = os.environ.get('KEYSTORE_KEY_ALIAS', '').strip().lstrip('\ufeff')

          with open('android/key.properties', 'w', encoding='utf-8') as f:
              f.write(f"storePassword={store_pass}\n")
              f.write(f"keyPassword={key_pass}\n")
              f.write(f"keyAlias={key_alias}\n")
              f.write("storeFile=release.keystore\n")
          PYEOF
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      - name: Build APK Release
        run: |
          API_URL="${{ secrets.API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://music-storage-backend.fly.dev/api"
          fi
          echo "Building APK with API_BASE_URL=$API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/meowsic.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sutorage.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meowsic-Release-APK
          path: build/app/outputs/flutter-apk/meowsic.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.21
          name: Meowsic App Release v1.0.21
          body: |
            ## Meowsic Music App Android Release v1.0.21
            - Tên hiển thị trên điện thoại: **Meowsic**
            - Phiên bản: **v1.0.21** (Build 22)
            - **Thiết kế lại công tắc Phát nhạc trong nền nhỏ gọn & vuông vắn (TechSwitch)**:
              - Thay thế công tắc tròn to bản Material mặc định bằng công tắc công nghệ `TechSwitch` với kích thước nhỏ gọn `36x20 dp`.
              - Thiết kế góc bo nhẹ sắc sảo (`3.0 dp` cho track, `2.0 dp` cho thumb vuông `16x16 dp`), tương phản cao, chuyển động trượt mượt mà kèm phản hồi xúc giác.
              - Hỗ trợ thao tác chạm linh hoạt trên toàn bộ hàng cài đặt để bật/tắt nhanh chóng.
            - **Kế thừa các cải tiến ổn định từ v1.0.20**:
              - Ảnh thumbnail chuẩn tỷ lệ tự nhiên, không bị co giãn/méo hình.
              - Khung "Bài tiếp theo" tích hợp trực tiếp vào màn hình phát nhạc thay cho màn hình hàng đợi riêng biệt.
              - Thêm "Phát tiếp theo" vào menu 3 chấm của mỗi bài hát.
              - Mục "Nhóm đang phát" hiển thị trực tiếp ở Trang Chủ khi tạm dừng nghe nhạc.
              - Hộp thoại hỏi ý kiến phát nhạc trong nền khi thoát ứng dụng.
            - Ký bằng **Release Keystore cố định** (Hỗ trợ cài đè/cập nhật trực tiếp không cần gỡ app cũ).
            - Tải file `meowsic.apk` bên dưới về điện thoại và cài đặt.
          files: |
            build/app/outputs/flutter-apk/meowsic.apk
            build/app/outputs/flutter-apk/sutorage.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
